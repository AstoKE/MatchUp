name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, unit tests, builds, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public, non-secret placeholder configuration used only for build smoke tests.
      EXPO_PUBLIC_APP_ENV: development
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build-smoke-test
      EXPO_PUBLIC_WEB_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check:brand
      - run: pnpm test:scripts
      - run: pnpm test
      - name: Web export (SPA) smoke build
        run: pnpm --filter @matchup/app export:web
        env:
          CI: '1'
      - name: No privileged credentials in the web bundle
        run: pnpm check:bundle
      - name: Web bundle size ratchet (regression guard; target budget in ARCHITECTURE §8)
        run: pnpm check:bundle-size
      - name: Native bundle compile smoke (Metro + Hermes, no device)
        run: pnpm --filter @matchup/app export:native
        env:
          CI: '1'
      - name: Expo doctor
        run: npx --yes expo-doctor@latest
        working-directory: apps/app
        env:
          CI: '1'
      - name: Dependency audit (fail on high/critical)
        run: pnpm audit --audit-level high --prod

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI instead of gitleaks-action: the action scans "<first pushed commit>^..HEAD", which
      # fails when the push contains the root commit, and it still runs on deprecated Node 20.
      # Keep the version in sync with scripts/github/setup-private-repo.ps1.
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full git history
        run: '"$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --log-opts="--all" --no-banner --redact'

  database:
    name: Database (migrations, pgTAP, API integration, type drift)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase stack (applies migrations + seed)
        run: pnpm db:start
      - name: pgTAP (schema, RLS, grants, SECURITY DEFINER hygiene)
        run: pnpm db:test
      - name: Integration tests (Data API exposure, real Auth + Mailpit flows)
        run: pnpm test:integration
      - name: Generated types must match migrations
        run: |
          pnpm db:types
          git diff --exit-code apps/app/src/types/supabase.generated.ts
      - name: Stop stack
        if: always()
        run: pnpm db:stop

  e2e-web:
    name: Web E2E (Playwright + axe, against the local Supabase stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase stack
        run: pnpm db:start
      - name: Write public local env (API URL + anon key only)
        run: pnpm env:local
      - name: Install Chromium
        run: pnpm --filter @matchup/app exec playwright install --with-deps chromium
      - name: Run E2E (exports the SPA, serves it, drives Chromium)
        run: pnpm --filter @matchup/app test:e2e
        env:
          CI: '1'
          REQUIRE_STACK: '1' # a missing stack must fail, never skip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/app/playwright-report
            apps/app/test-results
          retention-days: 7
      - name: Stop stack
        if: always()
        run: pnpm db:stop
