name: iOS simulator smoke

# Manual only: macOS minutes count 10x on a private repository (docs/NATIVE_VALIDATION.md, ADR-0022).
# The app is compiled by EAS (`eas build -p ios --profile simulator`, apps/app/eas.json); this job only
# installs that simulator build, runs the backend-independent Maestro flows and keeps the evidence.
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'EAS artifact URL of the simulator build (.tar.gz containing the .app)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-simulator
  cancel-in-progress: false

jobs:
  smoke:
    name: Install on the iOS simulator and run Maestro
    runs-on: macos-26
    timeout-minutes: 25
    env:
      MAESTRO_VERSION: 2.11.0
      # sha256 of maestro.zip for cli-2.11.0 (computed when the version was pinned).
      MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
      MAESTRO_CLI_NO_ANALYTICS: '1'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Toolchain in use (the exact Xcode and simulator runtimes are part of the evidence)
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Install Maestro (pinned, checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Download the simulator build
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          curl -fsSL -o "$RUNNER_TEMP/app.tar.gz" "$APP_URL"
          tar -xzf "$RUNNER_TEMP/app.tar.gz" -C "$RUNNER_TEMP/app"
          APP="$(find "$RUNNER_TEMP/app" -maxdepth 2 -name '*.app' -type d | head -1)"
          test -n "$APP"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
      - name: Boot the newest iPhone simulator and install
        run: |
          UDID="$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .key as $rt | .value[] | select(.name | startswith("iPhone")) | {rt: $rt, name: .name, udid: .udid}] | sort_by(.rt) | last | .udid')"
          test -n "$UDID" && test "$UDID" != null
          xcrun simctl list devices available | grep "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP_PATH"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Maestro flows that need no backend
        run: |
          mkdir -p ios-results
          status=0
          # 01 cold start, guest discovery, tabs, protected-route redirect; 14 in-app language switch
          for flow in 01-launch-and-navigation 14-language-selector; do
            maestro --device "$UDID" test \
              --test-output-dir "ios-results/$flow" --debug-output "ios-results/$flow" \
              "apps/app/e2e-mobile/flows/$flow.yaml" || status=1
          done
          exit $status
      - name: Simulator log of the app
        if: always()
        run: xcrun simctl spawn "$UDID" log show --last 15m --style compact > ios-results/simulator.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-results
          path: ios-results
          retention-days: 14
