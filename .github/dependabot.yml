version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      expo-sdk: { patterns: ['expo*', 'react-native*', '@expo/*', 'react', 'react-dom'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
