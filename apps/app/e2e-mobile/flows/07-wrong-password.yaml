appId: com.example.matchup.dev
# 07 Wrong password shows one generic message — requires -e EMAIL
---
- launchApp:
    clearState: true
- tapOn: 'Profile'
- tapOn: 'Email'
- inputText: ${EMAIL}
- tapOn: 'Password'
- inputText: 'definitely-the-wrong-password'
- tapOn: 'Sign in'
- assertVisible: 'Incorrect email or password.'
- takeScreenshot: 07-wrong-password
