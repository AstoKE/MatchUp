appId: com.example.matchup.dev
# 13 With the device language set to Turkish the UI is Turkish (tab labels, headings, special characters)
---
# No clearState: clearing app data also resets the per-app language the orchestrator set (adb cmd locale).
- launchApp
- assertVisible: 'Keşfet'
- assertVisible: 'Etkinliklerim'
- assertVisible: 'Oluştur'
- assertVisible: 'Profil'
- runFlow:
    when:
      visible: 'Hangi sporda.*'
    commands:
      - tapOn: 'Tüm sporlar'
- assertVisible: 'Filtreler'
- assertVisible: 'Ankara'
- tapOn: 'Etkinliklerim'
- assertVisible: 'Tekrar hoş geldin'
- takeScreenshot: 13-turkish-sign-in
