appId: com.example.matchup.dev
# 08 Server unreachable shows a clear network error; retry works after recovery — requires -e EMAIL and -e PASSWORD (orchestrator toggles adb reverse around this flow)
---
- launchApp:
    clearState: true
- tapOn: 'Profile'
- tapOn: 'Email'
- inputText: ${EMAIL}
- tapOn: 'Password'
- inputText: ${PASSWORD}
- tapOn: 'Sign in'
- assertVisible: "Couldn't connect. Check your internet connection and try again."
- takeScreenshot: 08-network-error
