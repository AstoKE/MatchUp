# No launchApp: the deep link (sent by the orchestrator via adb) already brought the app forward.
- assertVisible: 'Discover'
- tapOn: 'Profile'
- assertVisible: 'Signed in as ${EMAIL}'
- takeScreenshot: 03-signed-in
