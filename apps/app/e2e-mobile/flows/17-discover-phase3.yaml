appId: com.example.matchup.dev
# 17 Discover on the device (Phase 3) — requires -e TITLE (a published football event). Signed-in player whose
# profile sports are football and tennis: answers the sport question if it comes, the filters sit behind a button, and the
# event page has its join action on the first screen.
---
- launchApp
- runFlow:
    when:
      visible: 'Which court.*'
    commands:
      - tapOn: 'All sports'
- assertVisible: ${TITLE}
- takeScreenshot: 17-discover-list
- assertVisible: 'Football'
- tapOn: 'Filters.*'
- assertVisible: 'Indoor or outdoor'
- takeScreenshot: 17-discover-filters-open
- tapOn: 'Show results'
- tapOn: ${TITLE}
# The pinned action is on the first screen, and still there after scrolling the page
- assertVisible: 'Send join request'
- scroll
- assertVisible: 'Send join request'
- takeScreenshot: 17-event-page
