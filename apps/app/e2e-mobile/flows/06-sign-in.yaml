appId: com.example.matchup.dev
# 06 Sign in with credentials; returns to the page that required it — requires -e EMAIL and -e PASSWORD
---
- launchApp:
    clearState: true
- tapOn: 'My Events'
- assertVisible: 'Welcome back'
- tapOn: 'Email'
- inputText: ${EMAIL}
- tapOn: 'Password'
- inputText: ${PASSWORD}
- tapOn: 'Sign in'
# returnTo brought us back to My Events (a protected tab) rather than the home page
- assertVisible: 'My Events'
- assertNotVisible: 'Welcome back'
- takeScreenshot: 06-signed-in-returnTo
