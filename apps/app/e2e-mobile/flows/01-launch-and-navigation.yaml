appId: com.example.matchup.dev
# 01 Cold start, guest discovery, tab navigation, protected-route redirect
---
- launchApp:
    clearState: true
- assertVisible: 'Discover'
# The first visit asks for a sport
- assertVisible: 'Which sport.*'
- takeScreenshot: 01-discover-sport-picker
- tapOn: 'All sports'
# Phase 3: the list depends on what the database holds, the filters button is always there on a phone
- assertVisible: 'Filters'
# The four MVP destinations are present in the tab bar. iOS labels them "My Events, tab, 2 of 8", Android just
# "My Events": the optional suffix keeps one flow valid on both.
- assertVisible: 'My Events(, tab.*)?'
- assertVisible: 'Create(, tab.*)?'
- assertVisible: 'Profile(, tab.*)?'
- takeScreenshot: 01-discover-guest
# Protected tab sends a guest to sign-in (guard is UX; the server enforces the real rules)
- tapOn: 'My Events(, tab.*)?'
- assertVisible: 'Welcome back'
- takeScreenshot: 01-redirected-to-sign-in
