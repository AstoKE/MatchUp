appId: com.example.matchup.dev
# 18 Request to join with the on-screen keyboard open (Phase 3) — continues on the event page of flow 17;
# requires -e MSG. The pinned request form must stay usable while the keyboard is up.
---
- tapOn: 'Send join request'
- assertVisible: 'The organizer will see your display name and level.'
- tapOn: 'Message to the organizer (optional)'
- inputText: ${MSG}
# The send button is still reachable with the keyboard open (the area scrolls inside itself)
- assertVisible: 'Send request'
- takeScreenshot: 18-form-with-keyboard
# Emulator/Maestro quirk (see flow 15): release focus before tapping a button after injected text
- tapOn: 'The organizer will see your display name and level.'
- tapOn: 'Send request'
- assertVisible: 'Your request was sent'
- takeScreenshot: 18-request-sent
